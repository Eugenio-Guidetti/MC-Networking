<!DOCTYPE html>
<html lang="{{CURRENT_LANG}}">

	<head>
		<meta charset="UTF-8">
		<title>{{MSG_DEVICE_CLI_INDEX_TITLE}}</title>

		<link rel="stylesheet" href="/style.css">

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}

			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				box-sizing: border-box;
				padding: 12px 16px;
			}

			#cli-header {
				flex-shrink: 0;
				margin-bottom: 8px;
				display: block;
			}

			#cli-output {
				margin-top: auto;
				margin-bottom: 0;
				flex-shrink: 1;
				min-height: 0;
				overflow-y: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}

			pre,
			#cli-input-row {
				font-size: 14px;
				line-height: 1.4;
			}

			#cli-input-row {
				display: flex;
				align-items: center;
				bottom: 8px;
				width: 100%;
				box-sizing: border-box;
			}

			#cli-prompt {
				white-space: pre;
				font-family: inherit;
				font-size: inherit;
			}

			#cli-input {
				flex-grow: 1;
				background: transparent;
				border: none;
				outline: none;
				font-family: inherit;
				font-size: inherit;
				line-height: inherit;
				padding: 0;
				margin: 0;
			}
		</style>
	</head>

	<body>
		<strong id="cli-header">{{MSG_DEVICE_CLI_INDEX_CLI_HISTORY}}</strong>

		<pre id="cli-output">{{CLI_HISTORY}}</pre>

		<form id="cli-input-row" onsubmit="sendCommand(event)" {{CLI_ROW_STYLE_DISPLAY}}>
			<span id="cli-prompt">{{CLI_PROMPT}}</span>
			<input type="text" id="cli-input" autofocus autocomplete="off">
		</form>

		<script src="/scripts/cli.js"></script>
	</body>

</html>
