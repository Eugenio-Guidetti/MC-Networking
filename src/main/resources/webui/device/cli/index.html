<!DOCTYPE html>
<html lang="{{CURRENT_LANG}}">

	<head>
		<meta charset="UTF-8">
		<title>{{MSG_DEVICE_CLI_INDEX_TITLE}}</title>

		<link rel="stylesheet" href="/style.css">

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}

			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				box-sizing: border-box;
				padding: 12px 16px;
			}

			#cli-header {
				flex-shrink: 0;
				margin-bottom: 8px;
				display: block;
			}

			#cli-output {
				margin-top: auto;
				margin-bottom: 0;
				flex-shrink: 1;
				min-height: 0;
				overflow-y: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}

			pre,
			#cli-input-row {
				font-size: 14px;
				line-height: 1.4;
			}

			#cli-input-row {
				display: flex;
				align-items: center;
				bottom: 8px;
				width: 100%;
				box-sizing: border-box;
			}

			#cli-prompt {
				white-space: pre;
				font-family: inherit;
				font-size: inherit;
			}

			#cli-input {
				flex-grow: 1;
				background: transparent;
				border: none;
				outline: none;
				font-family: inherit;
				font-size: inherit;
				line-height: inherit;
				padding: 0;
				margin: 0;
			}
		</style>
	</head>

	<body>
		<strong id="cli-header">{{MSG_DEVICE_CLI_INDEX_CLI_HISTORY}}</strong>

		<pre id="cli-output">{{CLI_HISTORY}}</pre>

		<form id="cli-input-row" onsubmit="sendCommand(event)" {{CLI_ROW_STYLE_DISPLAY}}>
			<span id="cli-prompt">{{CLI_PROMPT}}</span>
			<input type="text" id="cli-input" autofocus autocomplete="off">
		</form>

		<script>
			// Recupera i parametri x, y, z dall'URL corrente della pagina
			const params = new URLSearchParams(window.location.search);
			const x = params.get("x");
			const y = params.get("y");
			const z = params.get("z");

			const input = document.getElementById("cli-input");

			if (x !== null && y !== null && z !== null) {
				const cliPre = document.getElementById("cli-output");
				const cliInputRow = document.getElementById("cli-input-row");
				const cliPrompt = document.getElementById("cli-prompt");

				const eventSource = new EventSource(`/device/cli/stream?x=${x}&y=${y}&z=${z}`);

				eventSource.onmessage = function (event) {
					// Decodifica il payload JSON ricevuto
					const data = JSON.parse(event.data);

					// Aggiornamento selettivo dei nodi DOM
					cliPre.textContent = data.output;
					cliInputRow.style.display = data.showPrompt ? "" : "none";
					cliPrompt.textContent = data.prompt;

					// Autoscroll verso il fondo
					cliPre.scrollTop = cliPre.scrollHeight;

					input.focus();
				};

				eventSource.onerror = function () {
					console.warn("Connessione SSE persa. Riconnessione automatica in corso...");
				};
			}


			// Seleziona automaticamente l'input field
			input.focus();

			document.addEventListener("click", () => {
				const selectedText = window.getSelection().toString();
				if (!selectedText) {
					input.focus();
				}
			});

			document.addEventListener("keydown", (event) => {
				if (event.ctrlKey || event.metaKey || event.altKey) {
					return;
				}

				if (document.activeElement !== input) {
					input.focus();
				}
			});

			function sendCommand(event) {
				event.preventDefault();
				const cmd = input.value;

				fetch(`/device/cli/send?x=${x}&y=${y}&z=${z}`, {
					method: "POST",
					body: cmd
				}).then(() => {
					input.value = "";
					input.focus();
				});
			}
		</script>
	</body>

</html>
