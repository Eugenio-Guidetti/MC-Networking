# Automatically build the project and run any configured tests for every push
# and submitted pull request.
name: build
on:
  pull_request:
  push:
    branches:
      - '*'
    tags:
      - 'v*' # Si attiva quando fai push di un tag che inizia con "v" (es. v1.0.0)

# Permessi necessari al bot di GitHub per creare la release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: Create GitHub Release
        # Questo step viene eseguito SOLO se l'evento che ha scatenato la action è un Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true